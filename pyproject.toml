[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-pathways"
version = "0.4.0"
description = "Experimental tools for uncertainty-aware decision workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Alejandro Sanchez Guinea"}]
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/asguinea/conformal-pathways"
Repository = "https://github.com/asguinea/conformal-pathways"
Issues = "https://github.com/asguinea/conformal-pathways/issues"
Documentation = "https://github.com/asguinea/conformal-pathways/tree/main/docs"

[project.optional-dependencies]
models = ["scikit-learn>=1.5,<2"]
imaging = ["torch>=2.5,<3", "torchvision>=0.20,<1", "pillow>=11,<13", "scikit-learn>=1.5,<2"]
plots = ["matplotlib>=3.9,<4"]

[project.scripts]
conformal-pathways = "conformal_pathways.cli:main"
conformal-pathways-ingest = "conformal_pathways.ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "build>=1.2,<2",
    "setuptools>=83,<85",
    "wheel>=0.45,<1",
    "ruff>=0.11,<1",
    "mypy>=1.19,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["conformal_pathways*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
required-version = ">=0.6"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
